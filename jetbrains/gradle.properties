# Pin the platform to your target IDE version (2025.3 or your exact build).
platformVersion = 2025.3

# Compatibility floor: 253 = 2025.3. Since this is personal/latest-only,
# you can leave the upper bound open.
pluginSinceBuild = 253
pluginUntilBuild =

# Depend on the bundled Terminal plugin (this is what provides the API).
platformBundledPlugins = org.jetbrains.plugins.terminal

# Leave external (marketplace) plugin deps empty.
platformPlugins =

group = com.sulsira.relay
version = 1.5.0

pluginRepositoryUrl = https://github.com/sulsira/relay

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
